# Uploads the site to the hidden /lpc-preview/ folder on the 123reg hosting over SFTP.
# Manual for now: Actions tab → "Preview to 123reg" → Run workflow, then pick a mode:
#   dry-run (default): read-only; lists what would change and prints SAFETY CHECK PASSED/FAILED
#   one-file-test:     uploads only lpc-preview/deploy-test.txt (time + commit), to prove the login works
#   full:              runs the same plan check first, then updates the lpc-preview folder (stops if the check fails)
#   look-around / find-folder: read-only diagnostics (list folders); used to find the website folder
# It only ever works inside the lpc-preview folder (which must already exist), never WordPress or the live homepage.
# Needs the repo secrets SFTP_HOST, SFTP_USER, SFTP_PASSWORD and SFTP_ROOT (= html, the website folder under the
# login's home). Full details: docs/DEPLOY-123REG.md.
name: Preview to 123reg

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "find-folder = show where lpc-preview is (read-only); dry-run = list changes only; one-file-test = upload deploy-test.txt only; full = update lpc-preview"
        type: choice
        options: [dry-run, find-folder, look-around, one-file-test, full]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: sftp-preview
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /lpc-preview
      PUBLIC_NOINDEX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Astro 7 needs Node >= 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to /lpc-preview/
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_ROOT: ${{ secrets.SFTP_ROOT }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          for v in SFTP_HOST SFTP_USER LFTP_PASSWORD; do
            [ -n "${!v}" ] || { echo "Missing secret: $v"; exit 1; }
          done
          ROOT="${SFTP_ROOT:-.}"
          [ -f dist/index.html ] || { echo "Build output missing"; exit 1; }
          lftp_run() {
            lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; open --env-password -u \"$SFTP_USER\" sftp://$SFTP_HOST; $1"
          }

          echo "== Landing folder on the server:"
          lftp_run "pwd; cd \"$ROOT\"; pwd"

          # Read-only: look up to two levels under the landing folder for lpc-preview, print where it is, then stop
          if [ "$MODE" = "find-folder" ]; then
            echo "== Looking for the lpc-preview folder (read-only, nothing is changed):"
            lftp_run "cls -1 -d lpc-preview; cls -1 -d */lpc-preview; cls -1 -d */*/lpc-preview" || true
            echo "== Done. Set SFTP_ROOT to the part before /lpc-preview (no SFTP_ROOT needed if it's just 'lpc-preview')."
            exit 0
          fi

          # Read-only: list names only (home folder, server top, and lpc-preview near the top), then stop
          if [ "$MODE" = "look-around" ]; then
            echo "== Home folder (including hidden items):"
            lftp_run "cls -1 -a -F ." || true
            echo "== Top of the server (/):"
            lftp_run "cls -1 -F /" || true
            echo "== Inside SFTP_ROOT ('$ROOT'):"
            lftp_run "cd \"$ROOT\"; pwd; cls -1 -a -F ." || true
            echo "== Any lpc-preview one or two levels below the top:"
            lftp_run "cls -1 -d /*/lpc-preview; cls -1 -d /*/*/lpc-preview" || true
            echo "== Done (nothing was changed)."
            exit 0
          fi

          # Safety: only continue if the lpc-preview folder already exists here (we made it by hand; the job never creates it)
          if ! lftp_run "cd \"$ROOT\"; cls -1 -d lpc-preview" | grep -qx 'lpc-preview/\?'; then
            echo "Stopping: no lpc-preview folder in '$ROOT'. Nothing was changed. Set the SFTP_ROOT secret if the login starts elsewhere."
            exit 1
          fi
          echo "== lpc-preview folder found"

          # mirror only inside lpc-preview/ (--delete removes old files there and nowhere else)
          FLAGS="--reverse --delete --verbose --parallel=4"
          # Plan check: a dry run, then an automatic verdict. Every full path in the plan (mkdir/rm/chmod lines)
          # must be inside <SFTP_ROOT>/lpc-preview, or the job stops before anything is uploaded.
          plan_check() {
            lftp_run "cd \"$ROOT\"; mirror $FLAGS --dry-run dist/ lpc-preview/" | tee plan.txt
            local inside="/${ROOT#./}/lpc-preview"; [ "$ROOT" = "." ] && inside="/lpc-preview"
            local paths outside
            paths=$(grep -E '^(mkdir|rm|chmod)' plan.txt | grep -c 'sftp://' || true)
            outside=$(grep -E '^(mkdir|rm|chmod)' plan.txt | grep 'sftp://' | grep -v -F "$inside" || true)
            echo "== Plan: $(grep -c '^Transferring file' plan.txt || true) files to upload, $(grep -c '^rm ' plan.txt || true) to delete"
            if [ -n "$outside" ]; then
              echo "!! SAFETY CHECK FAILED: the plan touches paths outside lpc-preview. Nothing was uploaded."
              exit 1
            fi
            echo "== SAFETY CHECK PASSED: all $paths paths in the plan are inside lpc-preview"
          }
          case "$MODE" in
            dry-run)
              echo "== DRY RUN: listing changes only, nothing will be uploaded"
              plan_check ;;
            one-file-test)
              printf 'Upload test from GitHub\nTime: %s\nCommit: %s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_SHA" > deploy-test.txt
              echo "== ONE-FILE TEST: uploading lpc-preview/deploy-test.txt only"
              lftp_run "cd \"$ROOT\"; cd lpc-preview; put deploy-test.txt; cls -l deploy-test.txt" ;;
            full)
              echo "== FULL: checking the plan first (dry run), then updating the lpc-preview folder"
              plan_check
              lftp_run "cd \"$ROOT\"; mirror $FLAGS dist/ lpc-preview/"
              echo "== UPLOAD FINISHED" ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac
          echo "== Done"
